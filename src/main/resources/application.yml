spring:
  application:
    name: loanrun-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      cleanup-cron: '0 */30 * * * *'
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
  mvc:
    log-resolved-exception: false
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: LOANRUN_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
        max-age: 7d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
loanrun:
  risk-history:
    enabled: ${RISK_HISTORY_ENABLED:false}
  demo-mode: ${DEMO_MODE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
